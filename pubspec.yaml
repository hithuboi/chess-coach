name: chess_app

description: A cross-platform chess application for macOS and iPadOS.

publish_to: 'none'

# Version 0.5.1 marks the current development build, including
# the coaching foundation and the threefold-repetition fix.
version: 0.5.1+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/pieces/
